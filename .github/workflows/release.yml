name: release

# Push a tag like v0.1.0 to release. The tag must match apps/cli/package.json.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-latest
            targets: darwin-arm64 darwin-x64
          - runner: ubuntu-latest
            targets: linux-arm64 linux-x64 linux-arm64-musl linux-x64-musl windows-x64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Check tag matches version
        run: test "v$(jq -r .version apps/cli/package.json)" = "$GITHUB_REF_NAME"
      - run: bun run --filter @tray-sh/worker build
      - run: bun scripts/build-binaries.ts ${{ matrix.targets }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.runner }}
          path: |
            dist/release
            dist/npm

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist/release && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes dist/release/*
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm
          path: dist/npm

  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm
          path: npm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted publishing (OIDC): no token. Platform packages first, launcher last.
      - name: Publish
        run: |
          chmod +x npm/cli-*/bin/tray || true
          for dir in npm/cli-*; do npm publish "./$dir" --access public; done
          npm publish ./npm/cli --access public

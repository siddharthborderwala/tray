name: Bug report
description: Something isn't working
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what you got.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tray --version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: macOS 26 arm64
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install tray?
      options:
        - curl tray.sh/install
        - npm / bun
        - GitHub release download
        - From source
